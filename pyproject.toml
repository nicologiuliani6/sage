[project]
name = "sage"
version = "0.1.0"
description = "SAGE: SSVC-Aware Guarded Engine. CVE applicability and patch decisions with LLMs for Kubernetes nodes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.17.3,<2.18",
    "pyyaml>=6.0",
]

[project.scripts]
sage = "sage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Il collector gira sui nodi con il Python di sistema (3.9 su Rocky 9).
per-file-target-version = { "ansible/files/*.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
