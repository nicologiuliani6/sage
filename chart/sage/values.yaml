# Valori del chart. Nessun valore specifico di un cluster: quelli obbligatori sono
# vuoti e l'installazione fallisce finché non li imposti nel tuo file di valori
# (es. values-local.yaml, da non committare). Esempio completo in
# examples/values.example.yaml.

image:
  repository: ""            # OBBLIGATORIO, es. ghcr.io/<owner>/sage
  digest: ""                # consigliato: sha256:... (se impostato, ignora tag)
  tag: ""                   # usato solo se digest è vuoto
  pullPolicy: IfNotPresent

imagePullSecrets: []        # es. [{name: ghcr-pull}] se l'immagine è privata

suspend: true               # true = controllore spento, nessun giro (nasce spento)
dryRun: true                # nessuna modifica ai nodi finché non lo disattivi
activeDeadlineSeconds: 10800  # tempo massimo di un controllo completo
scanTtlSecondsAfterFinished: 86400  # per quanto restano i Job di controllo finiti (e i loro log)

remediate:
  activeDeadlineSeconds: 14400   # tempo massimo per un nodo (drain, aggiornamento, riavvio)
  ttlSecondsAfterFinished: 259200  # per quanto restano i Job finiti (e i loro log)

secrets:
  ssh: sage-ssh             # Secret con le chiavi id_ed25519 e known_hosts
  llm: ""                   # Secret con le chiavi API degli endpoint LLM (opzionale)

extraEnv: []                # es. [{name: HTTPS_PROXY, value: "http://proxy:3128"}]

# Diventa /etc/sage/config/config.yaml. Schema e commenti in examples/config.example.yaml.
config:
  timezone: UTC             # fuso degli orari nel report, es. Europe/Rome
  controller:
    pause_minutes: 30       # pausa tra un giro e il successivo (0 = subito)
    poll_seconds: 30
    scan_parallel: 3        # nodi controllati insieme (pochi con storage condiviso)
    control_plane_stable_seconds: 60  # API sana da tanto prima di un nodo (x3 per un master)
  log_level: info           # info (fasi e avanzamento) o debug
  extra_services: {}        # nodo -> servizi o pacchetti fuori da Kubernetes da tenere
  ssh:
    user: ""                # OBBLIGATORIO: utente SSH sui nodi
    key_path: /etc/sage/ssh/id_ed25519
    known_hosts_path: /etc/sage/ssh/known_hosts
  llm:
    timeout_seconds: 60
    max_calls_per_run: 100
    min_interval_seconds: 0
    endpoints: []           # vuoto = solo regole deterministiche
  groups: []                # OBBLIGATORIO: almeno un gruppo di nodi
  sources:
    osv_url: https://api.osv.dev/v1   # Debian e Ubuntu: advisory e CVE (mirror interno ammesso)
  policy:
    protected_packages: []
    protected_modules: []
    idle_scans_required: 3  # "inutilizzato" solo dopo tanti controlli consecutivi...
    idle_days_required: 7   # ...e tanti giorni

# CA per l'HTTPS verso l'esterno (KEV, EPSS, OSV, LLM): ConfigMap con la chiave ca.crt.
# Serve dietro un proxy che ispeziona TLS. L'installer ci copia le CA del master.
caBundle:
  configMap: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Dashboard di sola lettura (ADR-0014): si apre con
#   kubectl -n <namespace> port-forward deploy/<release>-dashboard 8080:<port>
# e poi http://localhost:8080 (da un altro PC: ssh -L 8080:localhost:8080 <master>).
dashboard:
  enabled: true
  port: 8080
  refreshSeconds: 5           # ogni quanto la pagina rilegge i dati (minimo 2)
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
