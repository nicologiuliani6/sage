{{- include "sage.validate" . }}
{{- $args := list "scan" "--config" "/etc/sage/config/config.yaml" -}}
{{- if .Values.dryRun }}{{ $args = append $args "--dry-run" }}{{ end -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sage.fullname" . }}-scan
  labels:
    {{- include "sage.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- with .Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ .Values.suspend }}
  # Al massimo un'istanza alla volta: niente leader election da gestire.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "sage.labels" . | nindent 12 }}
            app.kubernetes.io/component: scan
        spec:
          {{- include "sage.podSpec" (dict "root" . "args" $args) | nindent 10 }}
