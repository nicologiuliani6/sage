apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sage.fullname" . }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
---
# Permessi sul cluster: leggere i nodi, metterli in cordon e svuotarli (drain).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sage.fullname" . }}-nodes
  labels:
    {{- include "sage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    # delete: solo per il drain dei gruppi requires_fallback (disable_eviction)
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sage.fullname" . }}-nodes
  labels:
    {{- include "sage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sage.fullname" . }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "sage.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Permessi nel solo namespace di SAGE: stato (ConfigMap) e Job di remediation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sage.fullname" . }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # Un solo controllore attivo alla volta.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sage.fullname" . }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sage.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sage.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Eventi sui nodi (ADR-0019): un Node non ha namespace e Kubernetes accetta i suoi eventi
# solo nel namespace "default". Solo "create", solo eventi.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sage.fullname" . }}-node-events
  namespace: default
  labels:
    {{- include "sage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sage.fullname" . }}-node-events
  namespace: default
  labels:
    {{- include "sage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sage.fullname" . }}-node-events
subjects:
  - kind: ServiceAccount
    name: {{ include "sage.fullname" . }}
    namespace: {{ .Release.Namespace }}
