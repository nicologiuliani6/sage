{{- include "sage.validate" . }}
{{- $scan := list "scan" "--config" "/etc/sage/config/config.yaml" -}}
{{- $ctl := list "controller" "--config" "/etc/sage/config/config.yaml" -}}
{{- if .Values.dryRun }}
{{- $scan = append $scan "--dry-run" }}
{{- $ctl = append $ctl "--dry-run" }}
{{- end }}
# Controllore (ADR-0015): un loop sempre acceso che fa il giro dei nodi. Una sola copia
# attiva alla volta (Lease); Recreate per non averne due durante un aggiornamento.
# Se il suo nodo viene svuotato per la remediation, Kubernetes lo ricrea su un altro
# nodo e riprende dallo stato salvato. suspend: true = nessun giro (0 copie).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sage.fullname" . }}-controller
  labels:
    {{- include "sage.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ if .Values.suspend }}0{{ else }}1{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "sage.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      {{- $probe := dict "exec" (dict "command" (list "python" "-c" "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/sage-controller-alive') > 600)")) "initialDelaySeconds" 60 "periodSeconds" 60 "timeoutSeconds" 10 }}
      {{- include "sage.podSpec" (dict "root" . "args" $ctl "restartPolicy" "Always" "noSsh" true "probe" $probe) | nindent 6 }}
---
# Modello del Job di controllo completo: il controllore lo crea a ogni giro.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sage.fullname" . }}-scan-template
  labels:
    {{- include "sage.labels" . | nindent 4 }}
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      labels:
        {{- include "sage.labels" . | nindent 8 }}
        app.kubernetes.io/component: scan
        sage.io/role: scan
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      # Il controllore legge l'esito subito: non serve tenere un Job per giro per giorni.
      ttlSecondsAfterFinished: {{ .Values.scanTtlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "sage.labels" . | nindent 12 }}
            app.kubernetes.io/component: scan
            sage.io/role: scan
        spec:
          {{- include "sage.podSpec" (dict "root" . "args" $scan) | nindent 10 }}
