{{- if .Values.dashboard.enabled }}
{{- include "sage.validate" . }}
{{- $name := printf "%s-dashboard" (include "sage.fullname" .) }}
{{- $port := int .Values.dashboard.port }}
# Dashboard di sola lettura (ADR-0014). Ascolta solo su 127.0.0.1 nel pod: si apre con
# `kubectl port-forward`, quindi chi la vede lo decide l'RBAC di Kubernetes. Nessun
# Service, nessun segreto montato, permessi di sola lettura su oggetti nominati.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "sage.fullname" . }}-report
      - {{ include "sage.fullname" . }}-state
      - {{ include "sage.fullname" . }}-history
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: [{{ include "sage.fullname" . }}-scan]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sage.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "sage.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
      annotations:
        # Riavvio quando cambia la configurazione (gruppi, finestre).
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: {{ include "sage.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - dashboard
            - --config
            - /etc/sage/config/config.yaml
            - --bind
            - 127.0.0.1
            - --port
            - {{ $port | quote }}
            - --refresh
            - {{ .Values.dashboard.refreshSeconds | quote }}
          env:
            - name: SAGE_RELEASE
              value: {{ .Release.Name | quote }}
            - name: SAGE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Il server ascolta solo in locale: le sonde lo interrogano da dentro il pod.
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ $port }}/healthz', timeout=3)"
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ $port }}/healthz', timeout=3)"
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/sage/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "sage.fullname" . }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
