name: publish

# Immagine su GHCR a ogni push su main; per un tag vX.Y.Z anche la release con
# l'installer e il chart (ci/release.sh).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/publish.sh

  # I test completi (python, kind, distro) li ha già passati la CI della PR e di main sullo
  # stesso commit: qui solo i controlli veloci, così una release esce in metà tempo.
  checks:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        job: [policy, chart]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: bash "ci/${{ matrix.job }}.sh"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # firma keyless di SHA256SUMS (cosign)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: bash ci/release.sh
