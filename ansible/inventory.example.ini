# Esempio per l'uso d'emergenza dal bastion. Copialo in inventory.ini (ignorato da git).
# Dentro il cluster l'inventario lo genera `sage` dall'API Kubernetes.

[all]
NODO_1_IP
NODO_2_IP

[all:vars]
ansible_user=UTENTE_SSH
ansible_ssh_private_key_file=PERCORSO_CHIAVE_DEDICATA_SAGE
# Se i nodi non sono raggiungibili direttamente:
# ansible_ssh_common_args=-o ProxyJump=UTENTE_SSH@IP_BASTION
