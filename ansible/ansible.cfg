[defaults]
# L'inventario non sta nella repo: lo genera `sage` dai nodi Kubernetes,
# oppure lo passi con -i in emergenza (vedi inventory.example.ini).
retry_files_enabled = False
interpreter_python = auto_silent
# Connessione e richiesta di sudo: 60 s invece di 10. Un nodo carico (es. VM su storage
# condiviso durante un controllo) risponde lento ma risponde: non va escluso dal giro.
timeout = 60

[ssh_connection]
pipelining = True
