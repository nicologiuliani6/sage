# Remediation di UN nodo, con rollback in caso di errore.
#
# Lanciato da `sage remediate` dentro un Job che gira su un altro nodo, oppure a mano
# dal bastion in emergenza (con -e sage_kube=false se l'API Kubernetes non risponde).
#
# Stesso flusso per tutte le distro; cambia solo il gestore di pacchetti (ADR-0017):
#   dnf     advisory con `dnf upgrade --advisory`, rollback con `dnf history undo`
#   zypper  patch con `zypper install -t patch`, rollback alle versioni precedenti
#   apt     pacchetti con `apt-get install --only-upgrade`, rollback alle versioni
#           precedenti se ancora nei repository; riavvio dopo ogni aggiornamento
#
# Variabili (da -e @vars.json):
#   sage_node_name           nome del nodo Kubernetes (obbligatorio)
#   sage_update_advisories   advisory da applicare (dnf: advisory, zypper: patch)
#   sage_update_packages     pacchetti da aggiornare (apt)
#   sage_package_manager     auto (predefinito) | dnf | zypper | apt
#   sage_remove_packages     pacchetti da rimuovere
#   sage_denylist_modules    moduli del kernel da bloccare
#   sage_drain_mode          evict | wait-empty
#   sage_drain_timeout       secondi concessi al drain
#   sage_disable_eviction    ignora i PodDisruptionBudget (solo gruppi con riserva LLM verificata)
#   sage_control_plane       true sui master: controlli aggiuntivi su apiserver ed etcd
#   sage_health_urls         URL che devono rispondere 2xx dopo l'intervento
#   sage_kube                false = nessun cordon/drain/controllo via API (emergenza)
#   sage_light               true = solo blocchi di moduli: niente cordon, drain né riavvio
#   sage_reboot_pending      true = riavvio in sospeso (aggiornamenti già installati)
- name: Remediation SAGE
  hosts: all
  gather_facts: false
  become: true
  vars:
    sage_kube: true
    sage_light: false
    sage_reboot_pending: false
    # Il nodo va svuotato solo per aggiornamenti e rimozioni, e solo se c'è l'API.
    sage_disrupt: "{{ sage_kube | bool and not sage_light | bool }}"
    sage_update_advisories: []
    sage_update_packages: []
    sage_package_manager: auto
    sage_remove_packages: []
    sage_denylist_modules: []
    sage_drain_mode: evict
    sage_drain_timeout: 1800
    sage_disable_eviction: false
    sage_control_plane: false
    sage_health_urls: []
    sage_denylist_file: /etc/modprobe.d/sage-denylist.conf
    sage_applied: false
    # Comandi per gestore di pacchetti. Le istantanee danno righe "nome=versione".
    sage_snapshot_cmd:
      zypper: ["rpm", "-qa", "--qf", "%{NAME}=%{EPOCHNUM}:%{VERSION}-%{RELEASE}\n"]
      apt: ["dpkg-query", "-W", "-f", "${Package}=${Version}\n"]
    sage_remove_cmd:
      dnf: ["dnf", "-y", "remove", "--noautoremove"]
      zypper: ["zypper", "-n", "remove", "--no-clean-deps"]
      apt: ["apt-get", "-y", "remove"]
    sage_downgrade_cmd:
      zypper: ["zypper", "-n", "install", "--oldpackage"]
      apt: ["apt-get", "-y", "install", "--allow-downgrades"]
  environment:
    LC_ALL: C
    DEBIAN_FRONTEND: noninteractive
  tasks:
    - name: Controlli preliminari
      ansible.builtin.assert:
        that:
          - sage_node_name is defined and sage_node_name | length > 0
          - ansible_play_hosts_all | length == 1
          - sage_drain_mode in ['evict', 'wait-empty']
        fail_msg: "remediate.yml agisce su un solo nodo alla volta, con sage_node_name"

    - name: Remediation
      block:
        - name: Gestore di pacchetti del nodo
          ansible.builtin.shell: |
            for pm in dnf zypper apt-get; do
              if command -v "$pm" > /dev/null; then echo "$pm"; exit 0; fi
            done
            exit 1
          register: sage_pm_found
          changed_when: false
          when: sage_package_manager == 'auto'

        - name: Gestore di pacchetti scelto
          ansible.builtin.set_fact:
            sage_pm: >-
              {{ (sage_pm_found.stdout | trim | replace('apt-get', 'apt'))
                 if sage_package_manager == 'auto' else sage_package_manager }}

        - name: Gestore di pacchetti supportato
          ansible.builtin.assert:
            that: sage_pm in ['dnf', 'zypper', 'apt']
            fail_msg: "gestore di pacchetti non supportato: {{ sage_pm }}"

        - name: Ultima transazione dnf prima dell'intervento
          ansible.builtin.command: dnf -q history info last
          register: sage_tx_before
          changed_when: false
          failed_when: false
          when: sage_pm == 'dnf'

        # apt e zypper non hanno una cronologia da annullare: si salvano le versioni.
        - name: Versioni dei pacchetti prima dell'intervento
          ansible.builtin.command:
            argv: "{{ sage_snapshot_cmd[sage_pm] }}"
          register: sage_snap_before
          changed_when: false
          when: sage_pm != 'dnf'

        - name: Cordon
          kubernetes.core.k8s_drain:
            name: "{{ sage_node_name }}"
            state: cordon
          delegate_to: localhost
          become: false
          register: sage_kube_op
          # Un errore passeggero dell'API (EOF, etcd lento, master che riparte) non deve far
          # fallire il Job: dopo un riavvio riuscito il rescue annullerebbe l'aggiornamento.
          until: sage_kube_op is succeeded
          retries: 6
          delay: 10
          when: sage_disrupt | bool

        # Il segno dice che il cordon è di SAGE: solo questi nodi SAGE può riprendere
        # (ADR-0019); un cordon messo da una persona non si tocca.
        - name: Segna il cordon di SAGE
          kubernetes.core.k8s:
            kind: Node
            name: "{{ sage_node_name }}"
            state: patched
            definition:
              metadata:
                annotations:
                  sage.io/cordoned: "true"
          delegate_to: localhost
          become: false
          register: sage_kube_op
          until: sage_kube_op is succeeded
          retries: 6
          delay: 10
          when: sage_disrupt | bool

        - name: Drain
          kubernetes.core.k8s_drain:
            name: "{{ sage_node_name }}"
            state: drain
            delete_options:
              ignore_daemonsets: true
              delete_emptydir_data: true
              disable_eviction: "{{ sage_disable_eviction | bool }}"
              wait_timeout: "{{ sage_drain_timeout | int }}"
          delegate_to: localhost
          become: false
          register: sage_kube_op
          # Un errore passeggero dell'API (EOF, etcd lento, master che riparte) non deve far
          # fallire il Job: dopo un riavvio riuscito il rescue annullerebbe l'aggiornamento.
          until: sage_kube_op is succeeded
          retries: 3
          delay: 10
          when: sage_disrupt | bool and sage_drain_mode == 'evict'

        - name: Attendi che il nodo si svuoti da solo (job lunghi)
          kubernetes.core.k8s_info:
            kind: Pod
            field_selectors:
              - "spec.nodeName={{ sage_node_name }}"
          register: sage_pods
          delegate_to: localhost
          become: false
          # Svuotato = nessun pod in esecuzione, esclusi DaemonSet e pod statici (owner Node).
          until: >-
            (sage_pods.resources
             | rejectattr('status.phase', 'in', ['Succeeded', 'Failed'])
             | rejectattr('metadata.ownerReferences', 'defined')
             | list | length)
            +
            (sage_pods.resources
             | rejectattr('status.phase', 'in', ['Succeeded', 'Failed'])
             | selectattr('metadata.ownerReferences', 'defined')
             | map(attribute='metadata.ownerReferences') | map('first')
             | rejectattr('kind', 'in', ['DaemonSet', 'Node'])
             | list | length) == 0
          retries: "{{ (sage_drain_timeout | int / 30) | round(0, 'ceil') | int }}"
          delay: 30
          when: sage_disrupt | bool and sage_drain_mode == 'wait-empty'

        - name: Da qui il nodo viene modificato
          ansible.builtin.set_fact:
            sage_applied: true

        # upgrade, non upgrade-minimal: con molte advisory insieme la versione "minima" di
        # una può essere incompatibile con quella richiesta da un'altra (es. python3 e
        # python-unversioned-command su Rocky 9). Si portano i pacchetti delle advisory alla
        # versione più recente, che è coerente e contiene tutte le correzioni.
        - name: Applica le advisory di sicurezza
          ansible.builtin.command:
            argv: "{{ ['dnf', '-y', 'upgrade'] + (sage_update_advisories | map('regex_replace', '^', '--advisory=') | list) }}"
          when: sage_pm == 'dnf' and sage_update_advisories | length > 0
          register: sage_update
          changed_when: "'Nothing to do' not in sage_update.stdout"

        # 103: zypper ha aggiornato se stesso e va rilanciato; 102: serve un riavvio.
        - name: Applica le patch di sicurezza
          ansible.builtin.command:
            argv: "{{ ['zypper', '-n', 'install', '-t', 'patch'] + sage_update_advisories }}"
          when: sage_pm == 'zypper' and sage_update_advisories | length > 0
          register: sage_zypper
          until: sage_zypper.rc != 103
          retries: 3
          delay: 1
          failed_when: sage_zypper.rc not in [0, 102, 103]
          changed_when: true

        - name: Aggiorna i pacchetti di sicurezza
          ansible.builtin.command:
            argv: "{{ ['apt-get', '-y', 'install', '--only-upgrade', '-o', 'Dpkg::Options::=--force-confdef', '-o', 'Dpkg::Options::=--force-confold'] + sage_update_packages }}"
          when: sage_pm == 'apt' and sage_update_packages | length > 0
          changed_when: true

        - name: Rimuovi i pacchetti inutilizzati
          ansible.builtin.command:
            argv: "{{ sage_remove_cmd[sage_pm] + sage_remove_packages }}"
          when: sage_remove_packages | length > 0
          changed_when: true

        - name: Blocca i moduli del kernel
          ansible.builtin.lineinfile:
            path: "{{ sage_denylist_file }}"
            line: "{{ item[0] }} {{ item[1] }}{{ ' /bin/false' if item[0] == 'install' else '' }}"
            create: true
            mode: "0644"
          loop: "{{ ['install', 'blacklist'] | product(sage_denylist_modules) | list }}"
          register: sage_blocks

        - name: Riavvio necessario? (dnf)
          ansible.builtin.command: dnf needs-restarting -r
          register: sage_restart_dnf
          changed_when: false
          failed_when: sage_restart_dnf.rc not in [0, 1]
          when: not sage_light | bool and sage_pm == 'dnf'

        # 102 = serve un riavvio. Un codice inatteso (zypper vecchio) vale come "sì".
        - name: Riavvio necessario? (zypper)
          ansible.builtin.command: zypper needs-rebooting
          register: sage_restart_zypper
          changed_when: false
          failed_when: false
          when: not sage_light | bool and sage_pm == 'zypper'

        # apt non dice quali processi usano librerie vecchie: dopo un aggiornamento si
        # riavvia sempre (il nodo è già svuotato).
        - name: Versioni dei pacchetti dopo l'intervento
          ansible.builtin.command:
            argv: "{{ sage_snapshot_cmd[sage_pm] }}"
          register: sage_snap_after
          changed_when: false
          when: not sage_light | bool and sage_pm == 'apt'

        - name: Riavvia il nodo
          ansible.builtin.reboot:
            reboot_timeout: 1800
            msg: "SAGE: riavvio dopo aggiornamenti di sicurezza"
          when: not sage_light | bool and sage_reboot | bool
          vars:
            sage_reboot: >-
              {{ (sage_reboot_pending | bool)
                 or (sage_pm == 'dnf' and sage_restart_dnf.rc == 1)
                 or (sage_pm == 'zypper' and sage_restart_zypper.rc != 0)
                 or (sage_pm == 'apt'
                     and (sage_snap_before.stdout_lines | difference(sage_snap_after.stdout_lines) | length > 0)) }}

        - name: Attendi che il nodo sia Ready
          kubernetes.core.k8s_info:
            kind: Node
            name: "{{ sage_node_name }}"
          register: sage_node
          delegate_to: localhost
          become: false
          # Durante il riavvio di un master l'API non risponde: il tentativo fallisce, non ha
          # `resources`, e si riprova (default: niente errore nella condizione).
          until: >-
            sage_node.resources | default([]) | length == 1
            and (sage_node.resources[0].status.conditions
                 | selectattr('type', 'equalto', 'Ready')
                 | map(attribute='status') | first | default('False')) == 'True'
          retries: 90
          delay: 10
          when: sage_disrupt | bool

        - name: Master - attendi kube-apiserver pronto
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: kube-system
            name: "kube-apiserver-{{ sage_node_name }}"
          register: sage_apiserver
          delegate_to: localhost
          become: false
          until: >-
            sage_apiserver.resources | default([]) | length == 1
            and (sage_apiserver.resources[0].status.conditions | default([])
                 | selectattr('type', 'equalto', 'Ready')
                 | map(attribute='status') | first | default('False')) == 'True'
          retries: 60
          delay: 10
          when: sage_disrupt | bool and sage_control_plane | bool

        - name: Master - etcd presente su questo nodo?
          ansible.builtin.command: systemctl cat etcd.service
          register: sage_etcd_unit
          changed_when: false
          failed_when: false
          when: sage_control_plane | bool and not sage_light | bool

        - name: Master - etcd attivo
          ansible.builtin.command: systemctl is-active etcd
          register: sage_etcd
          changed_when: false
          until: sage_etcd.stdout == 'active'
          retries: 30
          delay: 10
          when: sage_control_plane | bool and not sage_light | bool and sage_etcd_unit.rc == 0

        - name: Uncordon
          kubernetes.core.k8s_drain:
            name: "{{ sage_node_name }}"
            state: uncordon
          delegate_to: localhost
          become: false
          register: sage_kube_op
          # Un errore passeggero dell'API (EOF, etcd lento, master che riparte) non deve far
          # fallire il Job: dopo un riavvio riuscito il rescue annullerebbe l'aggiornamento.
          until: sage_kube_op is succeeded
          retries: 12
          delay: 10
          when: sage_disrupt | bool

        - name: Togli il segno del cordon
          kubernetes.core.k8s:
            kind: Node
            name: "{{ sage_node_name }}"
            state: patched
            definition:
              metadata:
                annotations:
                  sage.io/cordoned: null
          delegate_to: localhost
          become: false
          register: sage_kube_op
          until: sage_kube_op is succeeded
          retries: 6
          delay: 10
          when: sage_disrupt | bool

        - name: Controlli di salute del gruppo
          ansible.builtin.uri:
            url: "{{ item }}"
            status_code: [200, 201, 202, 203, 204]
          loop: "{{ sage_health_urls }}"
          register: sage_health
          until: sage_health is succeeded
          retries: 30
          delay: 10
          delegate_to: localhost
          become: false

      rescue:
        - name: Errore
          ansible.builtin.debug:
            msg: "remediation fallita su {{ sage_node_name }}: {{ ansible_failed_result.msg | default('vedi sopra') }}"

        # L'errore può arrivare anche a metà dell'aggiornamento: si legge lo stato adesso.
        - name: Ultima transazione dnf al momento dell'errore
          ansible.builtin.command: dnf -q history info last
          register: sage_tx_now
          changed_when: false
          failed_when: false
          when: sage_applied | bool and sage_pm | default('') == 'dnf'

        - name: Versioni dei pacchetti al momento dell'errore
          ansible.builtin.command:
            argv: "{{ sage_snapshot_cmd[sage_pm] }}"
          register: sage_snap_now
          changed_when: false
          failed_when: false
          when: sage_applied | bool and sage_pm | default('') in ['zypper', 'apt']

        # Pacchetti la cui versione di prima non c'è più (aggiornati o rimossi): con apt e
        # zypper sono quelli da riportare indietro.
        - name: Pacchetti cambiati
          ansible.builtin.set_fact:
            sage_changed: >-
              {{ (sage_snap_before.stdout_lines | default([]))
                 | difference(sage_snap_now.stdout_lines | default([])) }}
          when: sage_applied | bool and sage_pm | default('') in ['zypper', 'apt']

        # Modificato davvero solo se c'è una transazione dnf nuova, un pacchetto cambiato o
        # un blocco di moduli scritto. Un aggiornamento che si ferma prima (dipendenze non
        # risolte) non tocca il nodo: lo si rimette in servizio.
        - name: Il nodo è stato modificato?
          ansible.builtin.set_fact:
            sage_modified: >-
              {{ (sage_applied | bool)
                 and ((sage_tx_now_id != sage_tx_prev_id)
                      or (sage_changed | default([]) | length > 0)
                      or (sage_blocks is defined and sage_blocks.changed | default(false))) }}
          vars:
            sage_tx_now_id: "{{ sage_tx_now.stdout | default('') | regex_findall('Transaction ID[ ]*:[ ]*([0-9]+)') | first | default('') }}"
            sage_tx_prev_id: "{{ sage_tx_before.stdout | default('') | regex_findall('Transaction ID[ ]*:[ ]*([0-9]+)') | first | default('') }}"

        - name: Nulla era stato modificato - rimetti il nodo in servizio
          kubernetes.core.k8s_drain:
            name: "{{ sage_node_name }}"
            state: uncordon
          delegate_to: localhost
          become: false
          register: sage_kube_op
          # Un errore passeggero dell'API (EOF, etcd lento, master che riparte) non deve far
          # fallire il Job: dopo un riavvio riuscito il rescue annullerebbe l'aggiornamento.
          until: sage_kube_op is succeeded
          retries: 12
          delay: 10
          when: sage_disrupt | bool and not sage_modified | bool

        - name: Nulla era stato modificato - togli il segno del cordon
          kubernetes.core.k8s:
            kind: Node
            name: "{{ sage_node_name }}"
            state: patched
            definition:
              metadata:
                annotations:
                  sage.io/cordoned: null
          delegate_to: localhost
          become: false
          register: sage_kube_op
          until: sage_kube_op is succeeded
          retries: 6
          delay: 10
          when: sage_disrupt | bool and not sage_modified | bool

        - name: Annulla la transazione dnf di SAGE
          ansible.builtin.command: "dnf -y history undo {{ sage_tx_id }}"
          vars:
            # Nessun backslash nel pattern: evita i problemi di escape tra YAML e Jinja.
            sage_tx_id: "{{ sage_tx_now.stdout | default('') | regex_findall('Transaction ID[ ]*:[ ]*([0-9]+)') | first | default('') }}"
            sage_tx_prev: "{{ sage_tx_before.stdout | default('') | regex_findall('Transaction ID[ ]*:[ ]*([0-9]+)') | first | default('') }}"
          when:
            - sage_modified | bool
            - sage_pm | default('') == 'dnf'
            - sage_tx_id | length > 0
            - sage_tx_id != sage_tx_prev
          register: sage_undo
          changed_when: true
          # Il kernel in esecuzione non si può disinstallare: in quel caso si segnala e
          # si prosegue (il nodo resta in cordon, serve un riavvio sul kernel precedente).
          failed_when: false

        # Le versioni precedenti si reinstallano se il repository le ha ancora (Debian e
        # Ubuntu tengono la versione del rilascio, non sempre gli aggiornamenti intermedi).
        - name: Riporta i pacchetti alle versioni precedenti
          ansible.builtin.command:
            argv: "{{ sage_downgrade_cmd[sage_pm] + sage_changed }}"
          when:
            - sage_modified | bool
            - sage_pm | default('') in ['zypper', 'apt']
            - sage_changed | default([]) | length > 0
          register: sage_undo
          changed_when: true
          failed_when: false

        - name: Rollback non riuscito
          ansible.builtin.debug:
            msg: "ATTENZIONE: rollback non riuscito: {{ sage_undo.stdout_lines | default([]) | last | default('') }}"
          when: sage_undo is defined and sage_undo.rc is defined and sage_undo.rc != 0

        - name: Togli i blocchi dei moduli aggiunti in questo intervento
          ansible.builtin.lineinfile:
            path: "{{ sage_denylist_file }}"
            line: "{{ item[0] }} {{ item[1] }}{{ ' /bin/false' if item[0] == 'install' else '' }}"
            state: absent
          loop: "{{ ['install', 'blacklist'] | product(sage_denylist_modules) | list }}"
          when: sage_modified | bool

        # Rollback riuscito e nodo Ready: il nodo torna in servizio e SAGE lo ritenta più avanti
        # (quarantena, ADR-0019). Altrimenti resta in cordon.
        - name: Nodo sano dopo il rollback?
          kubernetes.core.k8s_info:
            kind: Node
            name: "{{ sage_node_name }}"
          register: sage_node_after
          delegate_to: localhost
          become: false
          until: sage_node_after.resources | default([]) | length == 1
          retries: 6
          delay: 10
          failed_when: false
          when: sage_disrupt | bool and sage_modified | bool

        - name: Esito del rollback
          ansible.builtin.set_fact:
            sage_back_in_service: >-
              {{ sage_disrupt | bool and sage_modified | bool
                 and (sage_undo is not defined or sage_undo.rc is not defined or sage_undo.rc == 0)
                 and (sage_node_after.resources | default([]) | map(attribute='status.conditions')
                      | first | default([]) | selectattr('type', 'equalto', 'Ready')
                      | map(attribute='status') | first | default('False')) == 'True' }}

        - name: Rollback riuscito - rimetti il nodo in servizio
          kubernetes.core.k8s_drain:
            name: "{{ sage_node_name }}"
            state: uncordon
          delegate_to: localhost
          become: false
          register: sage_kube_op
          until: sage_kube_op is succeeded
          retries: 12
          delay: 10
          when: sage_back_in_service | bool

        - name: Rollback riuscito - togli il segno del cordon
          kubernetes.core.k8s:
            kind: Node
            name: "{{ sage_node_name }}"
            state: patched
            definition:
              metadata:
                annotations:
                  sage.io/cordoned: null
          delegate_to: localhost
          become: false
          register: sage_kube_op
          until: sage_kube_op is succeeded
          retries: 6
          delay: 10
          when: sage_back_in_service | bool

        - name: Fallimento
          ansible.builtin.fail:
            msg: >-
              {{ 'Remediation fallita: rollback eseguito, nodo di nuovo in servizio.'
                 if sage_back_in_service | default(false) | bool else
                 'Remediation fallita dopo aver modificato il nodo: rollback eseguito, nodo lasciato in cordon (quarantena).'
                 if sage_modified | bool else
                 'Remediation fallita senza modificare il nodo: nodo rimesso in servizio.' }}
