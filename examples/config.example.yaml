# Esempio di configurazione di SAGE. Nessun valore qui è un default del codice:
# copialo, adattalo al tuo cluster e validalo con `sage check-config --config ...`.
#
# Dentro il cluster questo file arriva dal chart Helm (values → ConfigMap):
# vedi examples/values.example.yaml.

timezone: Europe/Rome                    # fuso degli orari nel report e nei log

# Il controllore gira in loop: controllo completo, remediation un nodo alla volta (gruppi
# in ordine, canary per primo), pausa, di nuovo da capo.
controller:
  pause_minutes: 30                      # pausa tra un giro e il successivo (0 = subito)
  poll_seconds: 30                       # ogni quanto guarda lo stato dei Job
  scan_parallel: 3                       # nodi controllati insieme (pochi con storage condiviso)
  control_plane_stable_seconds: 60       # API sana da tanto prima di un nodo (x3 per un master)

# Dettaglio del log: info (fasi, avanzamento, una riga per chiamata LLM) o debug.
log_level: info

# Servizi (unit systemd) o pacchetti fuori da Kubernetes che un nodo deve tenere, anche
# quando in quel momento non girano: contano come necessari. Nome del nodo -> elenco.
# Si gestiscono anche dall'installer (Modifica il cluster).
extra_services: {}
#  worker01: [backup-agent.service, node-exporter.service]

ssh:
  user: UTENTE_SSH                       # utente sui nodi, con sudo
  key_path: /etc/sage/ssh/id_ed25519     # chiave dedicata a SAGE (Secret montato)
  known_hosts_path: /etc/sage/ssh/known_hosts
  # proxy_jump: UTENTE@BASTION           # solo se i nodi non sono raggiungibili dal pod

llm:
  timeout_seconds: 60
  max_calls_per_run: 100                 # budget per giro; le risposte restano in cache
  min_interval_seconds: 2.5              # pausa tra chiamate (limiti dei piani gratuiti)
  endpoints:                             # provati in ordine; vuoto = solo regole fisse
    - name: locale-primario
      base_url: http://vllm.llm.svc:8000/v1
      model: openai/gpt-oss-120b
      hosted_in_group: gpu-llm           # gira su un nodo che SAGE aggiorna
      node_data: true                    # l'endpoint può ricevere dati dei nodi (ADR-0004)
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      api_key_env: GROQ_API_KEY          # nome della variabile, mai la chiave
# Al modello arrivano solo dati pubblici della CVE e il nome del pacchetto:
# nessun dato dei nodi esce dal cluster.

groups:                                  # i nodi fuori da ogni gruppo non vengono toccati
  - name: worker
    selector: sage.io/group=worker       # label selector Kubernetes
    order: 1                             # ordine delle ondate
    canary: NOME_NODO_CANARY             # primo nodo del gruppo nel giro
    kernel: auto                         # auto (nel giro, come il resto) | manual
    drain: evict                         # evict | wait-empty
    allow_remove: true                   # rimuovere pacchetti inutilizzati
    allow_mitigate: true                 # bloccare moduli del kernel
    max_unavailable: 1                   # nodi insieme: numero o "10%" (canary da solo, poi 1, 2, 4...)
    max_unavailable_per_zone: 0          # al massimo tanti per zona (topology.kubernetes.io/zone); 0 = no
  - name: gpu
    selector: sage.io/group=gpu
    order: 2
    canary: NOME_NODO_GPU_CANARY
    kernel: manual                       # kernel insieme al driver NVIDIA
    drain: wait-empty                    # aspetta la fine dei job lunghi
    drain_timeout_seconds: 21600
  - name: gpu-llm
    selector: sage.io/group=gpu-llm
    order: 3
    kernel: auto
    requires_fallback: true              # si tocca solo con una riserva LLM attiva
    health_urls:
      - http://vllm.llm.svc:8000/health
  - name: master
    selector: node-role.kubernetes.io/control-plane
    order: 4
    kernel: auto

sources:                                 # fonti pubbliche (questi sono i valori predefiniti)
  # Debian e Ubuntu: advisory (DSA, DLA, USN) e CVE degli aggiornamenti di sicurezza.
  # Riceve solo nome e versione dei pacchetti sorgente; può essere un mirror interno.
  osv_url: https://api.osv.dev/v1

policy:
  # "Inutilizzato" (base per "non affetto" e rimozione) solo se nessun processo usa il pacchetto
  # da almeno tanti controlli consecutivi E da almeno tanti giorni.
  idle_scans_required: 3
  idle_days_required: 7
  urgent_deadline_hours: 6               # CVE gravi (KEV, sfruttate): da sistemare entro queste ore
  protected_packages:                    # mai rimossi (nomi di RHEL, SUSE e Debian/Ubuntu)
    - "kernel*"
    - "linux-image-*"
    - glibc
    - libc6
    - systemd
    - dnf
    - rpm
    - zypper
    - libzypp
    - apt
    - dpkg
    - sudo
    - "openssh*"
    - NetworkManager
    - network-manager
  protected_modules:                     # mai bloccati (servono a Kubernetes e alla rete)
    - "nf_*"
    - "ip_*"
    - "ip6_*"
    - br_netfilter
    - overlay
    - vxlan
    - veth
    - "xt_*"

# Avvisi quando un nodo va in quarantena o un gruppo si ferma (ADR-0019).
# Aggiornamento automatico alle release firmate (ADR-0021): solo in pausa tra due giri; se il
# SAGE nuovo non lavora torna alla versione di prima (e la riprova dopo 7 giorni).
self_update:
  channel: minor                         # off | patch (solo 0.X.y) | minor (mai una maggiore)
  check_hours: 24
  repository: OWNER/sage                 # repository GitHub delle release (lo scrive l'installer)

# alerts:
#   webhook_url: https://hooks.example/x   # POST JSON per ogni avviso; vuoto = solo eventi K8s
